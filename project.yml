# XcodeGen-määritys: aja `xcodegen` tämän kansion juuressa → Noste.xcodeproj
name: Noste
options:
  bundleIdPrefix: com.aihiolabs
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  NostePackage:
    path: NostePackage

targets:
  Noste:
    type: application
    platform: iOS
    sources:
      - Noste
    dependencies:
      - package: NostePackage
        product: NosteCore
      - target: NosteWatch
    entitlements:
      path: Noste/Noste.entitlements
      properties:
        # Tunnukset: Sign in with Apple (ei salasanoja). Vaatii capabilityn App ID:lle.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aihiolabs.noste
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "6"
        MARKETING_VERSION: "0.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Noste/Info.plist
      properties:
        CFBundleDisplayName: Noste
        # Ei omaa salausta → TestFlight-upload ilman vientikysymyksiä.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          Sijaintia käytetään kartalla, spottien lisäämiseen ja session GPS-jäljen,
          nopeuden ja foiliajan mittaamiseen myös näytön ollessa sammuksissa.
        NSMotionUsageDescription: >-
          Liikeanturia käytetään pumppausten ja foiliajan tunnistamiseen, kun
          sessio tallennetaan puhelimella.

  NosteWatch:
    type: application
    platform: watchOS
    sources:
      - NosteWatch
    dependencies:
      - package: NostePackage
        product: NosteCore
    entitlements:
      path: NosteWatch/NosteWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Syvyysanturi (Ultra): duck divet, vedenalainen aika, syvyys.
        com.apple.developer.submerged-shallow-depth-and-pressure: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aihiolabs.noste.watchkitapp
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "6"
        MARKETING_VERSION: "0.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: NosteWatch/Info.plist
      properties:
        CFBundleDisplayName: Noste
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.aihiolabs.noste
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        # allowsBackgroundLocationUpdates vaatii tämän — ilman se kaatuu
        # NSAssertioniin heti session käynnistyessä.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          Sijaintia käytetään session GPS-jäljen, nopeuden ja foiliajan mittaamiseen.
        NSHealthShareUsageDescription: >-
          Syke ja energiankulutus luetaan treenisession mittareihin.
        NSHealthUpdateUsageDescription: >-
          Sessio tallennetaan treeninä Terveys-sovellukseen.
        NSMotionUsageDescription: >-
          Liikeanturia käytetään pumppausten ja foiliajan tunnistamiseen.

schemes:
  Noste:
    build:
      targets:
        Noste: all
    run:
      config: Debug
  NosteWatch:
    build:
      targets:
        NosteWatch: all
    run:
      config: Debug
