[project]
name = "posetiivi"
version = "0.1.0"
description = "Digitaalinen posetiivi: kampi ohjaa Lyria RealTime -musiikkia Raspberry Pilla"
requires-python = ">=3.11"
dependencies = [
    "evdev>=1.7; platform_system == 'Linux'",
    "pyfluidsynth>=1.3",
]

[project.optional-dependencies]
# Pilvi-engine (Lyria RealTime): pip install .[lyria]
lyria = [
    "google-genai>=1.16",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]

[project.scripts]
posetiivi = "posetiivi.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["posetiivi"]
